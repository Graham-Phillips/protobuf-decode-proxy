[package]
name = "app"
version = "0.8.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
protobuf-decoder-proxy = { path = "../../../core/proxy" }
tauri = { version = "2", features = ["wry"] }

tauri-plugin-log = "2"
log = "0.4"
prost = "0.14"
prost-reflect = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1.1"
sha2 = "0.10"
zip = { version = "6", default-features = false, features = ["deflate"] }

[patch.crates-io]
rcgen = { path = "../../../core/proxy/vendor/rcgen-0.14.8" }
