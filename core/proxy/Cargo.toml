[package]
name = "protobuf-decoder-proxy"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[dependencies]
aws-lc-rs = "1"
futures-util = "0.3"
http-body-util = "0.1"
hyper-rustls = { version = "0.27", default-features = false, features = ["aws-lc-rs", "http1", "logging", "tls12"] }
hudsucker = { version = "0.24.1", default-features = false, features = ["rcgen-ca", "rustls-client"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio-rustls = "0.26"
tokio-tungstenite = "0.28"

[patch.crates-io]
# Temporary until rcgen 0.14.x releases a fix for rustc 1.96 E0119 conflicts.
rcgen = { path = "vendor/rcgen-0.14.8" }
